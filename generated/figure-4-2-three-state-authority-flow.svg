<rect x="40" y="380" width="420" height="145" rx="15" fill="#EAF3F8" stroke="#315D7D" stroke-width="3"/>
<text x="62" y="418" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#17324D">1  Suggest</text>
<text x="62" y="475" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#455A64">Show evidence and recommendation. A human</text>
<text x="62" y="497" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#455A64">decides.</text>
<rect x="540" y="380" width="420" height="145" rx="15" fill="#FFF5DF" stroke="#A96B17" stroke-width="3"/>
<text x="562" y="418" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#17324D">2  Propose + positive</text>
<text x="562" y="440" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#17324D">acknowledgement</text>
<text x="562" y="475" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#455A64">An authorized person approves this exact,</text>
<text x="562" y="497" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#455A64">unexpired proposal.</text>
<rect x="1040" y="380" width="420" height="145" rx="15" fill="#EAF6EF" stroke="#2C7250" stroke-width="3"/>
<text x="1062" y="418" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#17324D">3  Eligible for bounded automated</text>
<text x="1062" y="440" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#17324D">execution</text>
<text x="1062" y="475" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#455A64">A separately approved class may reach the</text>
<text x="1062" y="497" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#455A64">executor after recheck.</text>
<line x1="250" y1="525" x2="250" y2="585" stroke="#536B7A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="95" y="590" width="310" height="84" rx="12" fill="#F7F9FA" stroke="#607D8B" stroke-width="2"/>
<text x="250" y="625" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#17324D">Human decides</text>
<text x="250" y="652" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#455A64">accept, reject, modify, or ignore</text>
<line x1="750" y1="525" x2="750" y2="563" stroke="#536B7A" stroke-width="3" marker-end="url(#arrow)"/>
<polygon points="750,568 848,632 750,696 652,632" fill="#FFF7E7" stroke="#A96B17" stroke-width="2"/>
<text x="750" y="622" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#6E4915">Authorized positive</text>
<text x="750" y="646" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#6E4915">acknowledgement?</text>
<path d="M652 632 L565 632 L565 718" fill="none" stroke="#A43D34" stroke-width="3" marker-end="url(#red-arrow)"/>
<text x="640" y="617" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#A43D34">no / silence / expiry</text>
<rect x="395" y="723" width="340" height="94" rx="12" fill="#FCEDEC" stroke="#A43D34" stroke-width="2"/>
<text x="565" y="758" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#842F29">HOLD — demote to Suggest</text>
<text x="565" y="786" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6E3B36">material change also invalidates approval</text>
