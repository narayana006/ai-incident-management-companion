<text x="422" y="286" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#455A64">Applicable calibration</text>
<text x="422" y="303" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#455A64">contract</text>
<circle cx="665" cy="209" r="4" fill="#315D7D"/>
<text x="677" y="214" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#455A64">Reversal readiness</text>
<circle cx="665" cy="245" r="4" fill="#315D7D"/>
<text x="677" y="250" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#455A64">Single and cumulative bounds</text>
<circle cx="665" cy="281" r="4" fill="#315D7D"/>
<text x="677" y="286" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#455A64">Current authority and system</text>
<text x="677" y="303" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#455A64">state</text>
