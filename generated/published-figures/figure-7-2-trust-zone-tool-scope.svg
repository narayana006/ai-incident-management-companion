<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">Trust-zone and tool-scope matrix</title>
  <desc id="desc">A matrix maps seven governed functions to evidence reads, policy writes, production mutation, outbound communication, and audit append. Evidence assembly, reasoning, and validation have no production write or egress. Authorization reads policy but a separate deployment identity changes it. Only the narrow executor has one class-scoped production mutation. Only the narrow publisher has one audience-scoped communication channel. Every row can append a bounded record. A footer requires tests of inherited roles, delegations, jobs, repositories, and other indirect authority paths.</desc>
  <defs><style>
    .title{font:700 34px Arial,sans-serif;fill:#102A43}.sub{font:18px Arial,sans-serif;fill:#486581}.head{fill:#183153}.headText{font:700 17px Arial,sans-serif;fill:#FFFFFF}.rowA{fill:#F7FAFC}.rowB{fill:#EDF2F7}.rowLabel{font:700 18px Arial,sans-serif;fill:#243B53}.cell{font:16px Arial,sans-serif;fill:#334E68}.none{font:700 16px Arial,sans-serif;fill:#9B2C2C}.read{fill:#E8F1FA;stroke:#627D98;stroke-width:1.5}.write{fill:#E6FFFA;stroke:#087E8B;stroke-width:2.5}.egress{fill:#FFF8E7;stroke:#B7791F;stroke-width:2.5}.append{fill:#EEF2FF;stroke:#5145CD;stroke-width:1.5}.foot{fill:#FFF5F5;stroke:#C53030;stroke-width:2}.footTitle{font:700 19px Arial,sans-serif;fill:#9B2C2C}.footText{font:17px Arial,sans-serif;fill:#334E68}.grid{stroke:#CBD5E0;stroke-width:1}
  </style></defs>
  <rect width="1600" height="930" fill="#FFFFFF"/>
  <text x="60" y="62" class="title">Tool scope reveals whether functional separation is real</text>
  <text x="60" y="96" class="sub">Permissions shown here include inherited, brokered, delegated, and indirect paths—not just role names.</text>
  <rect x="55" y="135" width="1490" height="64" rx="10" class="head"/>
  <text x="82" y="175" class="headText">FUNCTION / PRINCIPAL</text><text x="402" y="175" class="headText">EVIDENCE READ</text><text x="650" y="175" class="headText">POLICY WRITE</text><text x="874" y="175" class="headText">PRODUCTION MUTATION</text><text x="1154" y="175" class="headText">OUTBOUND</text><text x="1367" y="175" class="headText">AUDIT</text>

  <rect x="55" y="199" width="1490" height="82" class="rowA"/><rect x="55" y="281" width="1490" height="82" class="rowB"/><rect x="55" y="363" width="1490" height="82" class="rowA"/><rect x="55" y="445" width="1490" height="82" class="rowB"/><rect x="55" y="527" width="1490" height="82" class="rowA"/><rect x="55" y="609" width="1490" height="82" class="rowB"/><rect x="55" y="691" width="1490" height="82" class="rowA"/>
  <path d="M365 135 V773 M615 135 V773 M835 135 V773 M1120 135 V773 M1335 135 V773" class="grid"/>
  <path d="M55 281 H1545 M55 363 H1545 M55 445 H1545 M55 527 H1545 M55 609 H1545 M55 691 H1545 M55 773 H1545" class="grid"/>

  <text x="82" y="247" class="rowLabel">Evidence assembly</text><rect x="390" y="217" width="200" height="45" rx="9" class="read"/><text x="414" y="245" class="cell">Claim-scoped reads</text><text x="690" y="247" class="none">NONE</text><text x="930" y="247" class="none">NONE</text><text x="1195" y="247" class="none">NONE</text><rect x="1360" y="217" width="160" height="45" rx="9" class="append"/><text x="1398" y="245" class="cell">Append ref</text>
  <text x="82" y="329" class="rowLabel">Reason / propose</text><rect x="390" y="299" width="200" height="45" rx="9" class="read"/><text x="407" y="327" class="cell">Governed workspace</text><text x="690" y="329" class="none">NONE</text><text x="930" y="329" class="none">NONE</text><text x="1195" y="329" class="none">NONE</text><rect x="1360" y="299" width="160" height="45" rx="9" class="append"/><text x="1385" y="327" class="cell">Append proposal</text>
  <text x="82" y="411" class="rowLabel">Validation</text><rect x="390" y="381" width="200" height="45" rx="9" class="read"/><text x="414" y="409" class="cell">Re-derived reads</text><text x="690" y="411" class="none">NONE</text><text x="930" y="411" class="none">NONE</text><text x="1195" y="411" class="none">NONE</text><rect x="1360" y="381" width="160" height="45" rx="9" class="append"/><text x="1380" y="409" class="cell">Append checks</text>
  <text x="82" y="493" class="rowLabel">Authorization</text><rect x="390" y="463" width="200" height="45" rx="9" class="read"/><text x="414" y="491" class="cell">Policy + state</text><text x="646" y="480" class="none">NONE</text><text x="646" y="507" class="cell">separate deploy ID</text><text x="930" y="493" class="none">NONE</text><text x="1195" y="493" class="none">NONE</text><rect x="1360" y="463" width="160" height="45" rx="9" class="append"/><text x="1383" y="491" class="cell">Append decision</text>
  <text x="82" y="575" class="rowLabel">Narrow executor</text><rect x="390" y="545" width="200" height="45" rx="9" class="read"/><text x="415" y="573" class="cell">Target recheck</text><text x="690" y="575" class="none">NONE</text><rect x="855" y="543" width="245" height="49" rx="9" class="write"/><text x="880" y="574" class="cell">ONE CLASS-SCOPED VERB</text><text x="1195" y="575" class="none">NONE</text><rect x="1360" y="545" width="160" height="45" rx="9" class="append"/><text x="1383" y="573" class="cell">Append result</text>
  <text x="82" y="657" class="rowLabel">No-egress drafter</text><rect x="390" y="627" width="200" height="45" rx="9" class="read"/><text x="407" y="655" class="cell">Approved incident</text><text x="690" y="657" class="none">NONE</text><text x="930" y="657" class="none">NONE</text><text x="1195" y="657" class="none">NONE</text><rect x="1360" y="627" width="160" height="45" rx="9" class="append"/><text x="1380" y="655" class="cell">Append draft</text>
  <text x="82" y="739" class="rowLabel">Narrow publisher</text><rect x="390" y="709" width="200" height="45" rx="9" class="read"/><text x="405" y="737" class="cell">Frozen message</text><text x="690" y="739" class="none">NONE</text><text x="930" y="739" class="none">NONE</text><rect x="1140" y="707" width="175" height="49" rx="9" class="egress"/><text x="1157" y="738" class="cell">ONE AUDIENCE</text><rect x="1360" y="709" width="160" height="45" rx="9" class="append"/><text x="1380" y="737" class="cell">Append publish</text>

  <rect x="55" y="812" width="1490" height="80" rx="12" class="foot"/><text x="82" y="844" class="footTitle">Ceremony test</text><text x="250" y="844" class="footText">Attempt every excluded call. Trace assumed roles, jobs, repositories, publishers, delegations, and legacy credentials.</text><text x="250" y="873" class="footText">If one function can reach the same consequence indirectly, the negative cell is false and the trust boundary remains open.</text>
</svg>
