<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Seven-link decision provenance chain with external checkpoints</title>
  <desc id="desc">Seven records—trigger, evidence, proposal, validation, authorization, execution, and outcome—are appended in sequence. Each record binds its predecessor using a versioned canonical format, record-type domain, and named digest algorithm. A periodic checkpoint with signer and key identifier is stored in a second trust domain. The diagram states the limits: the chain cannot prove pre-capture completeness, source truth, decision correctness, continued retention, reference access, or the absence of administrator compromise.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#5145CD"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#102A43}.sub{font:18px Arial,sans-serif;fill:#486581}.card{fill:#F7FAFC;stroke:#627D98;stroke-width:2}.auth{fill:#FFF8E7;stroke:#B7791F;stroke-width:3}.exec{fill:#E6FFFA;stroke:#087E8B;stroke-width:3}.outcome{fill:#FDECEC;stroke:#B83280;stroke-width:3}.num{font:700 16px Arial,sans-serif;fill:#FFFFFF}.circle{fill:#183153}.label{font:700 21px Arial,sans-serif;fill:#102A43}.small{font:15px Arial,sans-serif;fill:#334E68}.tiny{font:14px Arial,sans-serif;fill:#486581}.link{stroke:#5145CD;stroke-width:4;fill:none;marker-end:url(#arrow)}.checkpoint{fill:#EEF2FF;stroke:#5145CD;stroke-width:3}.checkTitle{font:700 21px Arial,sans-serif;fill:#3C366B}.limit{fill:#FFF5F5;stroke:#C53030;stroke-width:2}.limitTitle{font:700 19px Arial,sans-serif;fill:#9B2C2C}.limitText{font:16px Arial,sans-serif;fill:#334E68}.api{fill:#E8F1FA;stroke:#183153;stroke-width:2}.apiText{font:700 17px Arial,sans-serif;fill:#183153}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="60" y="60" class="title">Provenance supports reconstruction; it does not certify the decision</text>
  <text x="60" y="94" class="sub">Each append binds a typed record to its predecessor. An independently held checkpoint makes some later rewriting visible.</text>
  <rect x="60" y="125" width="1480" height="58" rx="12" class="api"/><text x="91" y="162" class="apiText">NORMAL APPEND-ONLY API · executor may append · executor has no update/delete permission · records are versioned, not magically immutable</text>

  <rect x="60" y="225" width="190" height="160" rx="14" class="card"/><circle cx="92" cy="254" r="18" class="circle"/><text x="87" y="260" class="num">1</text><text x="120" y="262" class="label">Trigger</text><text x="82" y="303" class="small">Incident + signal</text><text x="82" y="330" class="small">scope + valid time</text><text x="82" y="357" class="tiny">initiating identity</text>
  <rect x="275" y="225" width="190" height="160" rx="14" class="card"/><circle cx="307" cy="254" r="18" class="circle"/><text x="302" y="260" class="num">2</text><text x="335" y="262" class="label">Evidence</text><text x="297" y="303" class="small">Policy manifest</text><text x="297" y="330" class="small">state + digest/ref</text><text x="297" y="357" class="tiny">limitations visible</text>
  <rect x="490" y="225" width="190" height="160" rx="14" class="card"/><circle cx="522" cy="254" r="18" class="circle"/><text x="517" y="260" class="num">3</text><text x="550" y="262" class="label">Proposal</text><text x="512" y="303" class="small">Hypotheses + action</text><text x="512" y="330" class="small">alternatives + versions</text><text x="512" y="357" class="tiny">no authority</text>
  <rect x="705" y="225" width="190" height="160" rx="14" class="card"/><circle cx="737" cy="254" r="18" class="circle"/><text x="732" y="260" class="num">4</text><text x="765" y="262" class="label">Validation</text><text x="727" y="303" class="small">Re-derived claims</text><text x="727" y="330" class="small">checks + dissent</text><text x="727" y="357" class="tiny">unresolved visible</text>
  <rect x="920" y="225" width="190" height="160" rx="14" class="auth"/><circle cx="952" cy="254" r="18" class="circle"/><text x="947" y="260" class="num">5</text><text x="980" y="262" class="label">Authorization</text><text x="942" y="303" class="small">Policy + guard</text><text x="942" y="330" class="small">human ack + capability</text><text x="942" y="357" class="tiny">exact digests bound</text>
  <rect x="1135" y="225" width="190" height="160" rx="14" class="exec"/><circle cx="1167" cy="254" r="18" class="circle"/><text x="1162" y="260" class="num">6</text><text x="1195" y="262" class="label">Execution</text><text x="1157" y="303" class="small">Identity + request</text><text x="1157" y="330" class="small">target + nonce state</text><text x="1157" y="357" class="tiny">ambiguity retained</text>
  <rect x="1350" y="225" width="190" height="160" rx="14" class="outcome"/><circle cx="1382" cy="254" r="18" class="circle"/><text x="1377" y="260" class="num">7</text><text x="1410" y="262" class="label">Outcome</text><text x="1372" y="303" class="small">Verification evidence</text><text x="1372" y="330" class="small">human adjudication</text><text x="1372" y="357" class="tiny">correction retained</text>
  <path d="M250 305 H275 M465 305 H490 M680 305 H705 M895 305 H920 M1110 305 H1135 M1325 305 H1350" class="link"/>

  <rect x="60" y="430" width="900" height="155" rx="16" class="checkpoint"/><text x="88" y="469" class="checkTitle">Versioned binding at each append</text><text x="88" y="507" class="small">record digest = SHA-256(domain || canonical-format/version || predecessor || typed record)</text><text x="88" y="538" class="small">checkpoint = count + head digest + signer + key ID → second trust domain</text><text x="88" y="567" class="tiny">The fixture uses a public mechanism key; a production design must define algorithm agility, custody, rotation, access, and verification.</text>
  <rect x="1000" y="430" width="540" height="155" rx="16" class="checkpoint"/><text x="1028" y="469" class="checkTitle">Reconstruction availability</text><text x="1028" y="507" class="small">CAPTURED + RETAINED + REFERENCE RESOLVES</text><text x="1028" y="538" class="small">+ REVIEWER AUTHORIZED + CHECKPOINT VALID</text><text x="1028" y="567" class="tiny">If content ages out, report “integrity skeleton only.”</text>

  <rect x="60" y="630" width="1480" height="205" rx="16" class="limit"/><text x="88" y="670" class="limitTitle">The chain does not prove</text><text x="88" y="707" class="limitText">• that an event omitted before capture ever existed in the record</text><text x="88" y="740" class="limitText">• that a source response was true, complete, or representative</text><text x="88" y="773" class="limitText">• that the decision was correct or that a model's reasoning is explained</text><text x="790" y="707" class="limitText">• that storage, anchors, administrators, or key custody were uncompromised</text><text x="790" y="740" class="limitText">• that retained references remain readable to this reviewer</text><text x="790" y="773" class="limitText">• that a digest redacts low-entropy or correlatable sensitive data</text><text x="88" y="810" class="tiny">Minimize and redact before append. Prefer opaque authorized references and keyed digests where the threat model requires them.</text>
</svg>
